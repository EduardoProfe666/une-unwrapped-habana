name: Backfill AI analysis

on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Year to process (or "all" for matrix over 2022-2026)'
        required: true
        default: 'all'
        type: string
      max_messages:
        description: 'Optional cap on messages per job (leave empty for no cap)'
        required: false
        default: ''
        type: string
      batch_size:
        description: 'Inference batch size (default 128)'
        required: false
        default: '128'
        type: string

jobs:
  decide-matrix:
    runs-on: ubuntu-latest
    outputs:
      years: ${{ steps.set.outputs.years }}
    steps:
      - id: set
        name: Build year matrix
        run: |
          if [ "${{ github.event.inputs.year }}" = "all" ]; then
            echo 'years=["2022","2023","2024","2025","2026"]' >> "$GITHUB_OUTPUT"
          else
            echo 'years=["${{ github.event.inputs.year }}"]' >> "$GITHUB_OUTPUT"
          fi

  backfill:
    needs: decide-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Serialize commits to avoid telegram_messages.db merge conflicts.
    # Jobs still run sequentially across years (max-parallel: 1) but each
    # one is now ~3-10 min instead of hours.
    concurrency:
      group: backfill-ai-db
      cancel-in-progress: false
    permissions:
      contents: write

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        year: ${{ fromJSON(needs.decide-matrix.outputs.years) }}

    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      TRANSFORMERS_OFFLINE: "0"
      HF_HUB_OFFLINE: "0"
      # Force ONNX Runtime to use all logical cores; tokenizers parallelism off
      # since we batch at the pipeline level.
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/huggingface
          key: hf-models-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'core/ai/models.py', 'core/ai/taxonomy.py') }}
          restore-keys: |
            hf-models-${{ runner.os }}-
            hf-models-

      - name: Install dependencies
        run: uv sync --frozen

      - name: Warm AI models (cache miss only)
        run: uv run python -m core.ai.models

      - name: Pull latest before processing
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "${{ github.ref_name }}" || true

      - name: Backfill AI analysis for ${{ matrix.year }}
        run: |
          ARGS="--year ${{ matrix.year }} --batch-size ${{ github.event.inputs.batch_size || '128' }}"
          if [ -n "${{ github.event.inputs.max_messages }}" ]; then
            ARGS="$ARGS --max-messages ${{ github.event.inputs.max_messages }}"
          fi
          uv run python scripts/backfill_ai.py $ARGS
        env:
          CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}

      - name: Re-run analyzer for ${{ matrix.year }}
        run: |
          uv run python -c "from core import analyze_data; analyze_data(${{ matrix.year }})"
        env:
          CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}

      - name: Commit and Push changes
        run: |
          git pull --rebase origin "${{ github.ref_name }}" || true
          git add telegram_messages.db "app/public/data/analysis_data_${{ matrix.year }}.json"
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit for ${{ matrix.year }}."
          else
            git commit -m "AI backfill ${{ matrix.year }}: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for i in 1 2 3; do
              if git push; then
                echo "Push succeeded on attempt $i"
                exit 0
              fi
              echo "Push failed (attempt $i); rebasing and retrying..."
              git pull --rebase origin "${{ github.ref_name }}"
            done
            echo "Push failed after 3 attempts." && exit 1
          fi
